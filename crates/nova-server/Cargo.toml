[package]
name = "nova-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-binary Rust Axum + str0m WebRTC SFU + SQLite signaling server for Nova"

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
nova-core = { path = "../nova-core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "json", "uuid"] }
str0m = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
