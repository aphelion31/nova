services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: nova-nginx:1.1.1
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      axum:
        condition: service_healthy
    networks: [nova]

  axum:
    build:
      context: .
      dockerfile: ./docker/axum/Dockerfile
    image: nova-axum:1.1.1
    env_file:
      - path: .env
        required: false
    ports:
      - "${SFU_UDP_PORT:-10000}:10000/udp"
    environment:
      BIND: 0.0.0.0:3000
      SFU_UDP_BIND: 0.0.0.0:10000
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-127.0.0.1}
      WEB_DIR: /srv/nova/web/build/client
      DATABASE_URL: sqlite:///srv/nova/data/nova.db?mode=rwc
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-nova-dev-secret-change-me}
      JWT_APP_ID: ${JWT_APP_ID:-nova-meet}
      JWT_APP_SECRET: ${JWT_APP_SECRET:-nova-jwt-dev-secret-change-me}
      RUST_LOG: ${RUST_LOG:-info,str0m=warn}
    volumes:
      - nova_data:/srv/nova/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    init: true
    mem_limit: 256m
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/health]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [nova]

volumes:
  nova_data:

networks:
  nova:
    driver: bridge
